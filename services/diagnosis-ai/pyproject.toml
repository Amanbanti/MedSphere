[project]
name = "medsphere-diagnosis-ai"
version = "0.1.0"
description = "MedSphere clinical AI assist service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "numpy>=2.2",
  "scikit-learn>=1.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
