global:
  imageRegistry: ghcr.io/medsphere
  imageTag: "1.0.0"
  environment: production
  domain: medsphere.health

postgresql:
  enabled: true
  auth:
    database: medsphere
    username: medsphere
  primary:
    persistence:
      size: 100Gi

redis:
  enabled: true
  architecture: replication
  auth:
    enabled: true

kafka:
  enabled: true
  replicaCount: 3
  persistence:
    size: 50Gi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: api.medsphere.health
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway
    - host: admin.medsphere.health
      paths:
        - path: /
          pathType: Prefix
          service: admin-portal

services:
  api-gateway:
    enabled: true
    replicaCount: 2
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
