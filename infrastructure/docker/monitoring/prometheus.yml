global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: medsphere-api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:4000"]

  - job_name: medsphere-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:4100"
          - "host.docker.internal:4101"
          - "host.docker.internal:4102"
