openapi: 3.1.0
info:
  title: MedSphere Platform API
  version: 1.0.0
  description: |
    Root OpenAPI composition for MedSphere hospital information system APIs.
    Individual domain specifications are split by bounded context.
  contact:
    name: MedSphere Platform Engineering
servers:
  - url: https://api.medsphere.internal
    description: Production API gateway
tags:
  - name: Authentication
    description: MedSphere Auth API
  - name: Patients
    description: MedSphere Patient API
  - name: Appointments
    description: MedSphere Appointment API
  - name: Clinical Records
    description: MedSphere EMR API
  - name: Laboratory
    description: MedSphere Laboratory API
  - name: Radiology
    description: MedSphere Radiology API
  - name: Pharmacy
    description: MedSphere Pharmacy API
  - name: Billing
    description: MedSphere Billing API
  - name: Insurance
    description: MedSphere Insurance API
  - name: Telemedicine
    description: MedSphere Telemedicine API
  - name: Notifications
    description: MedSphere Notification API
  - name: Analytics
    description: MedSphere Analytics API
  - name: Search
    description: MedSphere Search API
paths:
