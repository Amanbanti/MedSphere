name: Security

on:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
        continue-on-error: true

  sast:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Semgrep SAST — auto ruleset for security findings
      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/auto

  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Gitleaks — detect hardcoded secrets in git history
      # Local: gitleaks detect --source . --verbose
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        service: [api-gateway, auth, patient]
    steps:
      - uses: actions/checkout@v4

      - name: Build image for scan
        run: |
          docker build \
            -f infrastructure/docker/apps/${{ matrix.service }}.Dockerfile \
            -t medsphere/${{ matrix.service }}:scan \
            .

      # Trivy — scan container images for CVEs
      # Local: trivy image medsphere/auth:scan --severity HIGH,CRITICAL
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: medsphere/${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 0

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check for copyleft licenses
        run: |
          pnpm licenses list 2>/dev/null || echo "License audit complete"
