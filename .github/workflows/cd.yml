name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

concurrency:
  group: cd-${{ github.ref }}-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Placeholder — replace with your org registry
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/medsphere

jobs:
  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth
          - patient
          - doctor
          - appointment
          - medical-record
          - pharmacy
          - laboratory
          - radiology
          - billing
          - insurance
          - notification
          - video-consultation
          - diagnosis-ai
          - worker
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/apps/${{ matrix.service }}.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ inputs.environment || 'staging' }}

  deploy-staging:
    name: Deploy to ${{ inputs.environment || 'staging' }}
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy with Helm
        run: |
          VALUES_FILE="infrastructure/helm/charts/medsphere/values.yaml"
          if [ "${{ inputs.environment || 'staging' }}" = "production" ]; then
            VALUES_FILE="infrastructure/helm/values/values.prod.yaml"
          fi
          helm upgrade --install medsphere infrastructure/helm/charts/medsphere \
            --namespace medsphere \
            --create-namespace \
            -f "$VALUES_FILE" \
            --set global.imageTag=${{ github.sha }} \
            --set global.environment=${{ inputs.environment || 'staging' }} \
            --wait --timeout 15m

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/api-gateway -n medsphere --timeout=300s
          kubectl rollout status deployment/auth -n medsphere --timeout=300s
          kubectl get pods -n medsphere

      - name: Smoke test
        run: node scripts/ops/smoke-test.mjs --base-url ${{ secrets.STAGING_API_URL || 'https://api.staging.medsphere.health' }}
        continue-on-error: true
